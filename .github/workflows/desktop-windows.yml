name: desktop windows
on:
  push:
    paths: ['desktop/**', 'client/**', '.github/workflows/desktop-windows.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            desktop/package-lock.json
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal --component clippy --no-self-update && rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - run: npm ci
        working-directory: client
      - run: npm ci
        working-directory: desktop
      - name: Export the shared interface
        run: npm run export
        working-directory: desktop
      - name: Bridge tests
        run: node --test
        working-directory: desktop
      - name: Native tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --features tauri/custom-protocol
        working-directory: desktop
      - name: Credential Manager round trip
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --features tauri/custom-protocol system_credential_roundtrip -- --ignored
        working-directory: desktop
      - name: Clippy
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
        working-directory: desktop
      - name: Build the installer
        run: node scripts/build-windows.mjs
        working-directory: desktop
      - name: Install, launch and uninstall
        run: node scripts/smoke-windows.mjs
        working-directory: desktop
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: panecast-desktop-windows
          path: |
            build/desktop/*-windows-x64-setup.exe
            build/desktop/*-windows-x64-setup.exe.sha256
            build/desktop/desktop-windows-x64.json
            build/desktop/smoke/
          if-no-files-found: warn
