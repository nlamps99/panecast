name: PanecastUITests
options:
  bundleIdPrefix: com.nzx.panecast.qa
settings:
  base:
    CODE_SIGNING_ALLOWED: NO
    GENERATE_INFOPLIST_FILE: YES
    SWIFT_VERSION: 5.0
targets:
  PanecastUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: '16.4'
    sources: [Tests]
schemes:
  PanecastUITests:
    build:
      targets:
        PanecastUITests: [test]
    test:
      targets: [PanecastUITests]
