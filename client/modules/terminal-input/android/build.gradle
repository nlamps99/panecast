plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.terminalinput'
version = '0.1.0'

android {
  namespace "expo.modules.terminalinput"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // ReactFontManager: resolve fonts the same way RN Text does.
  implementation 'com.facebook.react:react-android'
}
